<svg width="900" height="210" viewBox="0 0 900 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="André Borba's GitHub Activity Graph">
  <defs>
    <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF3333" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF3333" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FF3333" stop-opacity="0.00"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5555"/>
      <stop offset="50%" stop-color="#FF2222"/>
      <stop offset="100%" stop-color="#FF4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FF3333" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .header { font: 700 18px 'Orbitron', 'Segoe UI', Ubuntu, Sans-Serif; fill: #FF3333; letter-spacing: 0.5px; }
    .badge-label { font: 600 11px 'Orbitron', 'Segoe UI', Ubuntu, Sans-Serif; fill: #EFE6D0; }
    .badge-val { font: 800 12px 'Orbitron', 'Segoe UI', Ubuntu, Sans-Serif; fill: #FF3333; }
    .axis-date { font: 500 10px 'Orbitron', 'Segoe UI', Ubuntu, Sans-Serif; fill: #888888; }
    .grid-val { font: 500 9px 'Segoe UI', Ubuntu, Sans-Serif; fill: #666666; }
    .peak-label { font: 800 10px 'Orbitron', 'Segoe UI', Ubuntu, Sans-Serif; fill: #FFFFFF; }
    .peak-label-sub { font: 700 9px 'Orbitron', 'Segoe UI', Ubuntu, Sans-Serif; fill: #FF9999; }
  </style>

  <!-- Background Card -->
  <rect x="1" y="1" width="898" height="208" rx="10" fill="#050505" stroke="#FF3333" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Corner Tech Accent -->
  <path d="M1 15 L1 1 L15 1" stroke="#FF3333" stroke-width="2.5" fill="none"/>
  <path d="M899 15 L899 1 L885 1" stroke="#FF3333" stroke-width="2.5" fill="none"/>
  <path d="M1 195 L1 209 L15 209" stroke="#FF3333" stroke-width="2.5" fill="none"/>
  <path d="M899 195 L899 209 L885 209" stroke="#FF3333" stroke-width="2.5" fill="none"/>

  <!-- Header Title -->
  <text x="25" y="35" class="header">ACTIVITY GRAPH · LAST 31 DAYS</text>

  <!-- Metric Badges (Top Right) -->
  <g transform="translate(470, 20)">
    <!-- Pill 1: Total -->
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#15080A" stroke="#FF3333" stroke-width="1"/>
    <text x="10" y="16" class="badge-label">TOTAL:</text>
    <text x="65" y="16" class="badge-val">1065</text>

    <!-- Pill 2: Peak -->
    <rect x="140" y="0" width="125" height="24" rx="4" fill="#15080A" stroke="#FF3333" stroke-width="1"/>
    <text x="150" y="16" class="badge-label">PEAK:</text>
    <text x="200" y="16" class="badge-val">89</text>

    <!-- Pill 3: Average -->
    <rect x="275" y="0" width="130" height="24" rx="4" fill="#15080A" stroke="#FF3333" stroke-width="1"/>
    <text x="285" y="16" class="badge-label">AVG:</text>
    <text x="325" y="16" class="badge-val">34.4/d</text>
  </g>

  <!-- Grid lines -->
  
      <line x1="45" y1="147.5" x2="865" y2="147.5" stroke="#FF3333" stroke-opacity="0.12" stroke-dasharray="3,4" stroke-width="1"/>
      <text x="37" y="150.5" text-anchor="end" class="grid-val">25</text>
    
      <line x1="45" y1="120" x2="865" y2="120" stroke="#FF3333" stroke-opacity="0.12" stroke-dasharray="3,4" stroke-width="1"/>
      <text x="37" y="123" text-anchor="end" class="grid-val">50</text>
    
      <line x1="45" y1="92.5" x2="865" y2="92.5" stroke="#FF3333" stroke-opacity="0.12" stroke-dasharray="3,4" stroke-width="1"/>
      <text x="37" y="95.5" text-anchor="end" class="grid-val">75</text>
    
      <line x1="45" y1="65" x2="865" y2="65" stroke="#FF3333" stroke-opacity="0.12" stroke-dasharray="3,4" stroke-width="1"/>
      <text x="37" y="68" text-anchor="end" class="grid-val">100</text>
    

