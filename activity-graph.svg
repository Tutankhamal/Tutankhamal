      <circle cx="99.7" cy="141.3" r="2" fill="#FF3333"/><circle cx="154.3" cy="133.2" r="2" fill="#FF3333"/><circle cx="209.0" cy="161.8" r="2" fill="#FF3333"/><circle cx="263.7" cy="150.8" r="2" fill="#FF3333"/><circle cx="318.3" cy="144.2" r="2" fill="#FF3333"/><circle cx="373.0" cy="164.7" r="2" fill="#FF3333"/><circle cx="427.7" cy="155.2" r="2" fill="#FF3333"/><circle cx="482.3" cy="153.7" r="2" fill="#FF3333"/>
