<svg width="450" height="195" viewBox="0 0 450 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="André Borba's GitHub Stats">
  <style>
    .header { font: 700 18px 'Orbitron', 'Segoe UI', Ubuntu, Sans-Serif; fill: #FF3333; }
    .stat-label { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #EFE6D0; }
    .stat-val { font: 700 14px 'Orbitron', 'Segoe UI', Ubuntu, Sans-Serif; fill: #FF3333; }
    .rank-text { font: 800 24px 'Orbitron', 'Segoe UI', Ubuntu, Sans-Serif; fill: #FF3333; }
    .subtext { font: 500 10px 'Segoe UI', Ubuntu, Sans-Serif; fill: #888888; }
  </style>
  <rect x="1" y="1" width="448" height="193" rx="10" fill="#050505" stroke="#FF3333" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Corner Tech Accent -->
  <path d="M1 15 L1 1 L15 1" stroke="#FF3333" stroke-width="2.5" fill="none"/>
  <path d="M449 15 L449 1 L435 1" stroke="#FF3333" stroke-width="2.5" fill="none"/>
  <path d="M1 180 L1 194 L15 194" stroke="#FF3333" stroke-width="2.5" fill="none"/>
  <path d="M449 180 L449 194 L435 194" stroke="#FF3333" stroke-width="2.5" fill="none"/>

  <text x="25" y="35" class="header">ANDRÉ'S GITHUB STATS</text>

  <g transform="translate(25, 60)">
    <!-- Total Commits -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="3" fill="#FF3333"/>
      <text x="18" y="10" class="stat-label">Total Contributions &amp; Commits:</text>
      <text x="235" y="10" class="stat-val">6,120+</text>
    </g>
    <!-- Public Repos -->
    <g transform="translate(0, 26)">
      <circle cx="6" cy="6" r="3" fill="#FF3333"/>
      <text x="18" y="10" class="stat-label">Active Monorepos &amp; Repos:</text>
      <text x="235" y="10" class="stat-val">2+</text>
    </g>
    <!-- Core Stack -->
    <g transform="translate(0, 52)">
      <circle cx="6" cy="6" r="3" fill="#FF3333"/>
      <text x="18" y="10" class="stat-label">Architecture Level:</text>
      <text x="235" y="10" class="stat-val">LEAD / ARCHITECT</text>
    </g>
    <!-- Studio -->
    <g transform="translate(0, 78)">
      <circle cx="6" cy="6" r="3" fill="#FF3333"/>
      <text x="18" y="10" class="stat-label">Production Ecosystem:</text>
      <text x="235" y="10" class="stat-val">STREAM.BUILDERS</text>
    </g>
  </g>

  <!-- Rank Badge Circle -->
  <g transform="translate(370, 105)">
    <circle cx="0" cy="0" r="32" fill="#15080A" stroke="#FF3333" stroke-width="2"/>
    <circle cx="0" cy="0" r="26" fill="#200a0d" stroke="#FF3333" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="0" y="8" text-anchor="middle" class="rank-text">A+</text>
  </g>
</svg>
